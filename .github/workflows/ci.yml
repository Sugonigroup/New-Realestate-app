name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages + core-api
        run: pnpm turbo run build --filter='./packages/**' --filter='./services/**'
      - name: Tests
        run: pnpm turbo run test --filter='./packages/**' --filter='./services/**'
      - name: Typecheck
        run: pnpm turbo run typecheck --filter='./packages/**' --filter='./services/**'
